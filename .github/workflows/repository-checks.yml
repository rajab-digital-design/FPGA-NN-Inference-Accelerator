name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check repository content, links, and archived metrics
        run: python scripts/check_release_package.py
      - name: Install numerical-analysis dependencies
        run: python -m pip install -r reference-model/matlab/analysis/requirements-analysis.txt
      - name: Recompute the software Q8.8 reference results
        run: python reference-model/matlab/analysis/compute_analysis.py --strict-existing-match --no-figures
